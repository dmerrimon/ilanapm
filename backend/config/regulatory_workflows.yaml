# Regulatory Workflows for Clinical Trial Ontology v3.0
# Comprehensive definitions for 22 countries covering regulatory approval workflows
# Version: 3.0
# Last Updated: 2026-01-16

regulatory_workflows:
  # ===========================================================================
  # LEVEL 1 - PARALLEL WORKFLOWS (4 countries)
  # Regulatory and Ethics reviews occur simultaneously
  # ===========================================================================

  - country_code: US
    country_name: "United States"
    workflow_type: "parallel"
    complexity_level: 1
    regulatory_authority:
      code: FDA
      name: "U.S. Food and Drug Administration"
      review_days: 30
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: IRB
      name: "Institutional Review Board"
      review_days: 30
      is_national: false
      meeting_frequency: "varies"
    workflow_steps:
      - step: 1
        name: "Parallel Submission"
        description: "Submit to FDA and IRB simultaneously"
        authorities: ["FDA", "IRB"]
        can_run_parallel: true
      - step: 2
        name: "Concurrent Review"
        description: "Both authorities review independently"
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "Both approvals required before start"
        gates: ["FDA_approval", "IRB_approval"]
    total_timeline_days: 30
    fees:
      - amount: 0
        currency: "USD"
        payer: "varies"
        notes: "No FDA fees for IND, IRB fees vary by institution"
    unique_features:
      - "Standard baseline for Western countries"
      - "30-day safety review hold period after IND submission"
      - "Decentralized IRB system"
    references:
      - "https://www.fda.gov/regulatory-information"

  - country_code: AU
    country_name: "Australia"
    workflow_type: "parallel"
    complexity_level: 1
    regulatory_authority:
      code: TGA
      name: "Therapeutic Goods Administration"
      review_days: 30
      auto_approval: false
      emergency_review_days: null
      notification_days: 0  # CTN instant acknowledgement
    ethics_authority:
      code: HREC
      name: "Human Research Ethics Committee"
      review_days: 30
      is_national: false
      meeting_frequency: "monthly"
    workflow_steps:
      - step: 1
        name: "CTN/CTA Choice"
        description: "Choose between Clinical Trial Notification (instant) or Clinical Trial Approval (30-50 days)"
        authorities: ["TGA"]
        can_run_parallel: true
      - step: 2
        name: "Parallel Review"
        description: "TGA and HREC review concurrently"
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "Both approvals required"
        gates: ["TGA_approval", "HREC_approval"]
    total_timeline_days: 30
    fees:
      - amount: 0
        currency: "AUD"
        payer: "unknown"
    unique_features:
      - "CTN (Clinical Trial Notification) pathway - instant acknowledgement"
      - "CTA (Clinical Trial Approval) pathway - 30-50 days"
      - "NMA (National Mutual Acceptance) for multicenter trials"
    references:
      - "https://www.tga.gov.au/"

  - country_code: CA
    country_name: "Canada"
    workflow_type: "parallel"
    complexity_level: 1
    regulatory_authority:
      code: HC
      name: "Health Canada"
      review_days: 30
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: REB
      name: "Research Ethics Board"
      review_days: null  # Variable
      is_national: false
      meeting_frequency: "varies"
    workflow_steps:
      - step: 1
        name: "Parallel Submission"
        description: "Submit to Health Canada and REB simultaneously"
        authorities: ["HC", "REB"]
        can_run_parallel: true
      - step: 2
        name: "Concurrent Review"
        description: "HC reviews within 30 days, REB timeline varies"
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "Both approvals required"
        gates: ["HC_approval", "REB_approval"]
    total_timeline_days: 30
    fees:
      - amount: 0
        currency: "CAD"
        payer: "unknown"
    unique_features:
      - "CTSI (Clinical Trial Site Information) form required per site"
      - "QIU (Qualified Investigator Undertaking) form"
      - "2-day sponsor response window for clarifications"
    references:
      - "https://www.canada.ca/en/health-canada.html"

  - country_code: GB
    country_name: "United Kingdom"
    workflow_type: "parallel_integrated"
    complexity_level: 1
    regulatory_authority:
      code: MHRA
      name: "Medicines and Healthcare products Regulatory Agency"
      review_days: 30
      auto_approval: true
      auto_approval_days: 30
      emergency_review_days: null
      notification_days: 14  # For Phase 3/4 notification scheme
    ethics_authority:
      code: REC
      name: "Research Ethics Committee"
      review_days: 60
      final_opinion_days: 60
      gene_therapy_days: 90
      specialist_consultation_days: 180
      is_national: true
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "IRAS Combined Application"
        description: "Single application submitted to both MHRA and REC via IRAS system"
        authorities: ["MHRA", "REC"]
        can_run_parallel: true
      - step: 2
        name: "Coordinated Parallel Review"
        description: "MHRA and REC review in parallel with joint RFIs"
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "Single UK decision covering all 4 nations"
        gates: ["MHRA_approval", "REC_approval"]
    total_timeline_days: 30
    fees:
      - amount: 0
        currency: "GBP"
        payer: "EC"
        notes: "ONLY country with NO EC FEES (£0)"
      - amount: 343
        currency: "GBP"
        payer: "MHRA"
        notes: "Minimum MHRA fee"
      - amount: 4656
        currency: "GBP"
        payer: "MHRA"
        notes: "Maximum MHRA fee (~$5,900)"
    unique_features:
      - "MOST INTEGRATED SYSTEM - IRAS combined review"
      - "Single application, coordinated parallel review, joint RFIs"
      - "Single UK decision covering England/Wales/Scotland/Northern Ireland"
      - "Notification scheme for Phase 3/4 trials (14 days)"
      - "Automatic authorization if no MHRA response in 30 days"
      - "Fast-track option for global trials and Phase 1"
      - "UKECA statutory EC oversight"
      - "HRA accreditation program"
      - "ICH E6(R2) compliance since 2016"
      - "ONLY country with NO EC FEES (£0)"
      - "Gene therapy requires GTAC review (90 days)"
    references:
      - "https://www.hra.nhs.uk/"
      - "https://www.gov.uk/government/organisations/medicines-and-healthcare-products-regulatory-agency"

  # ===========================================================================
  # LEVEL 2 - SEQUENTIAL WORKFLOWS (7 countries)
  # Ethics BEFORE Regulatory (strictly sequential)
  # ===========================================================================

  - country_code: BD
    country_name: "Bangladesh"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: DGDA
      name: "Directorate General of Drug Administration"
      review_days: 60
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: NREC
      name: "National Research Ethics Committee"
      review_days: null  # Variable
      is_national: true
      meeting_frequency: "monthly"
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to NREC for ethics approval"
        authorities: ["NREC"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review"
        description: "Submit to DGDA only after NREC approval"
        authorities: ["DGDA"]
        can_run_parallel: false
        gates: ["NREC_approval"]
        estimated_days: 60
      - step: 3
        name: "Final Approval"
        description: "DGDA approval completes process"
        gates: ["DGDA_approval"]
    total_timeline_days: 60  # Plus EC time
    fees:
      - amount: 0
        currency: "BDT"
        payer: "unknown"
    unique_features:
      - "Two-tier ethics (Institutional EC vs NREC)"
      - "Ethics BEFORE regulatory (strictly sequential)"
      - "NREC is national committee"
    references:
      - "http://www.dgda.gov.bd/"

  - country_code: GN
    country_name: "Guinea"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: DNPM
      name: "Direction Nationale de la Pharmacie et du Médicament"
      review_days: 14
      auto_approval: false
      emergency_review_days: 2  # 48-hour emergency response
    ethics_authority:
      code: CNERS
      name: "Comité National d'Ethique pour la Recherche en Santé"
      review_days: 60
      is_national: true
      meeting_frequency: "monthly"  # Last Thursday of each month
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to CNERS for ethics approval"
        authorities: ["CNERS"]
        can_run_parallel: false
        gates: []
        estimated_days: 60
      - step: 2
        name: "Regulatory Review"
        description: "Submit to DNPM only after CNERS approval"
        authorities: ["DNPM"]
        can_run_parallel: false
        gates: ["CNERS_approval"]
        estimated_days: 14
      - step: 3
        name: "Final Approval"
        description: "DNPM approval completes process"
        gates: ["DNPM_approval"]
    total_timeline_days: 74  # 60 + 14 days
    fees:
      - amount: 0
        currency: "GNF"
        payer: "unknown"
        notes: "Doctoral students may receive discounts"
    unique_features:
      - "48-hour emergency response (fastest documented)"
      - "Monthly EC meetings (last Thursday)"
      - "Explicit prohibition on parallel submission"
      - "French language requirement"
    references:
      - "http://www.cners-guinee.org/"

  - country_code: MW
    country_name: "Malawi"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: PMRA
      name: "Pharmacy, Medicines and Poisons Regulatory Authority"
      review_days: null  # Variable
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: NHSRC
      name: "National Health Sciences Research Committee"
      review_days: null  # Variable
      is_national: true
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to NHSRC or COMREC for ethics approval"
        authorities: ["NHSRC"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review"
        description: "Submit to PMRA only after EC approval"
        authorities: ["PMRA"]
        can_run_parallel: false
        gates: ["EC_approval"]
      - step: 3
        name: "Final Approval"
        description: "PMRA approval completes process"
        gates: ["PMRA_approval"]
    total_timeline_days: null  # Variable
    fees:
      - amount: 0
        currency: "MWK"
        payer: "application"
        notes: "5% of total trial budget as application fee"
      - amount: 2200
        currency: "USD"
        payer: "annual_renewal"
    unique_features:
      - "Two NCST-approved ECs (NHSRC and COMREC)"
      - "5% total budget application fee (unique model)"
      - "$2,200 annual renewal fee"
      - "REIMS portal for electronic submissions"
      - "GCP inspections during trials"
      - "NCST (National Commission for Science and Technology) oversight"
    references:
      - "https://www.pharmreg.mw/"

  - country_code: ML
    country_name: "Mali"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: DPM
      name: "Direction de la Pharmacie et du Médicament"
      review_days: 15
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: CIESS_USTTB
      name: "CIESS/USTTB Ethics Committee"
      review_days: null  # Variable
      is_national: false  # Primary EC but not national
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to CIESS/USTTB or other approved EC"
        authorities: ["CIESS_USTTB"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review"
        description: "Submit to DPM only after EC approval"
        authorities: ["DPM"]
        can_run_parallel: false
        gates: ["EC_approval"]
        estimated_days: 15
      - step: 3
        name: "Final Approval"
        description: "DPM approval completes process"
        gates: ["DPM_approval"]
    total_timeline_days: 15  # Plus EC time
    fees:
      - amount: 0
        currency: "XOF"
        payer: "unknown"
    unique_features:
      - "CIESS/USTTB is primary EC for clinical research"
      - "French language requirement"
      - "MSDS (Ministry of Health) parent ministry oversight"
      - "15-day DPM evaluation target"
      - "Six-EC system in country"
    references:
      - "http://www.sante.gov.ml/"

  - country_code: MX
    country_name: "Mexico"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: COFEPRIS
      name: "Comisión Federal para la Protección contra Riesgos Sanitarios"
      review_days: 30
      fra_reliance_days: 45  # For FRA reliance pathway
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: REC
      name: "Comités de Ética en Investigación (Research Ethics Committees)"
      review_days: 30  # Recommended
      is_national: false
      meeting_frequency: "varies"
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to institution's REC for approval"
        authorities: ["REC"]
        can_run_parallel: false
        gates: []
        estimated_days: 30
      - step: 2
        name: "Regulatory Review"
        description: "Submit to COFEPRIS only after REC approval"
        authorities: ["COFEPRIS"]
        can_run_parallel: false
        gates: ["REC_approval"]
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "COFEPRIS approval completes process"
        gates: ["COFEPRIS_approval"]
    total_timeline_days: 60  # 30 + 30 days
    fees:
      - amount: 0
        currency: "MXN"
        payer: "REC"
        notes: "RECs funded by institutions (no fees to applicants)"
      - amount: 3000
        currency: "USD"
        payer: "UHAP"
        notes: "Optional third-party pre-assessment (30 days)"
    unique_features:
      - "FRA reliance model (EMA, FDA, MHRA, Health Canada for Phase III)"
      - "UHAP optional third-party pre-assessment (30 days, $3,000)"
      - "DIGIPRiS electronic platform"
      - "RNEC v2.0 registry for RECs"
      - "RECs funded by institutions (no applicant fees)"
      - "ICH member country"
      - "Decentralized REC system"
    references:
      - "https://www.gob.mx/cofepris"

  - country_code: PE
    country_name: "Peru"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: INS
      name: "Instituto Nacional de Salud"
      review_days: 30
      auto_approval: false
      emergency_review_days: null
      anm_binding_opinion: true  # ANM binding opinion included in 30-day timeline
    ethics_authority:
      code: EC
      name: "INS-accredited Ethics Committee"
      review_days: null  # Variable
      is_national: false
      meeting_frequency: "varies"
      ins_accreditation_required: true
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to INS-accredited EC for approval"
        authorities: ["EC"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review with ANM Opinion"
        description: "Submit to INS only after EC approval; includes ANM binding technical opinion"
        authorities: ["INS", "ANM"]
        can_run_parallel: false
        gates: ["EC_approval"]
        estimated_days: 30
      - step: 3
        name: "Final Approval"
        description: "INS approval completes process (includes ANM opinion)"
        gates: ["INS_approval", "ANM_opinion"]
    total_timeline_days: 30  # Plus EC time, ANM opinion included in 30-day INS timeline
    fees:
      - amount: 0
        currency: "PEN"
        payer: "unknown"
    unique_features:
      - "ANM (Agencia Nacional de Medicamentos) binding technical opinion on IP safety/quality"
      - "ANM opinion included in 30-day timeline"
      - "REPEC v2 registry for ECs"
      - "MPV virtual submission platform"
      - "Minor changes vs amendments distinction"
      - "In-country sponsor representation required"
      - "EC accreditation only for clinical trials"
    references:
      - "https://www.ins.gob.pe/"

  - country_code: MW
    country_name: "Malawi"
    workflow_type: "sequential"
    complexity_level: 2
    regulatory_authority:
      code: PMRA
      name: "Pharmacy, Medicines and Poisons Regulatory Authority"
      review_days: null  # Variable
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: NHSRC
      name: "National Health Sciences Research Committee"
      review_days: null  # Variable
      is_national: true
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "Ethics Committee Review"
        description: "Submit to NHSRC or COMREC for ethics approval"
        authorities: ["NHSRC"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review"
        description: "Submit to PMRA only after EC approval"
        authorities: ["PMRA"]
        can_run_parallel: false
        gates: ["EC_approval"]
      - step: 3
        name: "Final Approval"
        description: "PMRA approval completes process"
        gates: ["PMRA_approval"]
    total_timeline_days: null  # Variable
    fees:
      - amount: 0
        currency: "MWK"
        payer: "application"
        notes: "5% of total trial budget as application fee"
      - amount: 2200
        currency: "USD"
        payer: "annual_renewal"
    unique_features:
      - "Two NCST-approved ECs (NHSRC and COMREC)"
      - "5% total budget application fee"
      - "$2,200 annual renewal"
      - "REIMS portal for electronic submissions"
      - "GCP inspections during trials"
    references:
      - "https://www.pharmreg.mw/"

  # ===========================================================================
  # LEVEL 2.5 - FLEXIBLE WORKFLOWS (2 countries)
  # Can switch between sequential and parallel based on conditions
  # ===========================================================================

  - country_code: SL
    country_name: "Sierra Leone"
    workflow_type: "flexible"
    complexity_level: 2.5
    regulatory_authority:
      code: PBSL
      name: "Pharmacy Board of Sierra Leone"
      review_days_device: 40
      review_days_pharma: 50
      review_days_biologics: 60
      review_days_gmo: 120
      expedited_review_days: 10  # Minimum
      expedited_review_days_max: 20  # Maximum
      auto_approval: false
      emergency_review_days: null
    ethics_authority:
      code: SLESRC
      name: "Sierra Leone Ethics and Scientific Review Committee"
      review_days: null  # No specified timeline
      is_national: true
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "Default Sequential Submission"
        description: "Normally submit to SLESRC for ethics approval first"
        authorities: ["SLESRC"]
        can_run_parallel: false
        gates: []
      - step: 2
        name: "Regulatory Review (or Parallel for Emergencies)"
        description: "Submit to PBSL after SLESRC, OR IN PARALLEL for public health emergencies or as PBSL deems fit"
        authorities: ["PBSL"]
        can_run_parallel: true  # Flexible based on emergency status
        gates: ["SLESRC_approval"]  # Required for sequential
        estimated_days: 50  # Pharma baseline
      - step: 3
        name: "Final Approval"
        description: "PBSL approval completes process"
        gates: ["PBSL_approval"]
    total_timeline_days: 50  # Plus EC time for sequential, varies for parallel
    fees:
      - amount: 6500
        currency: "USD"
        payer: "industry_min"
      - amount: 7000
        currency: "USD"
        payer: "industry_max"
      - amount: 100
        currency: "USD"
        payer: "annual_renewal"
    unique_features:
      - "FLEXIBLE workflow (sequential OR parallel)"
      - "Default sequential, switches to parallel for public health emergencies or at PBSL discretion"
      - "HIGHEST timeline variability by product type (40-120 days)"
      - "FRA reliance (ICH members, AVAREF)"
      - "PACTR registration required"
      - "15 hard copies + 1 soft copy required"
      - "Annual renewal required ($100)"
      - "Moderately high fees ($6,500-$7,000 for industry)"
      - "Expedited review available (10-20 working days)"
    references:
      - "http://www.mohs.gov.sl/"

  - country_code: ZA
    country_name: "South Africa"
    workflow_type: "flexible"
    complexity_level: 2.5
    regulatory_authority:
      code: SAHPRA
      name: "South African Health Products Regulatory Authority"
      review_days_screening: 21  # ~3 weeks
      review_days_ctc: 70  # ~10 weeks
      total_review_days: 91  # ~13 weeks combined
      auto_approval: false
      emergency_review_days: null  # Rapid review available
    ethics_authority:
      code: EC
      name: "Registered Research Ethics Committee"
      review_days: null  # Variable, defined in EC SOPs
      is_national: false  # Multiple registered ECs
      meeting_frequency: "varies"
      nhrec_oversight: true
      registration_required: true
      accreditation_required: true
    workflow_steps:
      - step: 1
        name: "Parallel Submission (Default)"
        description: "Submit to SAHPRA and EC in parallel (default approach)"
        authorities: ["SAHPRA", "EC"]
        can_run_parallel: true
        gates: []
      - step: 2
        name: "Sequential Option (Recommended When EC Lacks Capacity)"
        description: "If EC lacks scientific review capacity, submit SAHPRA first, then EC"
        authorities: ["SAHPRA", "EC"]
        can_run_parallel: false  # Sequential when EC lacks capacity
        gates: ["SAHPRA_scientific_review"]
        estimated_days: 91
      - step: 3
        name: "Final Approval"
        description: "Both approvals required"
        gates: ["SAHPRA_approval", "EC_approval"]
    total_timeline_days: 91  # ~13 weeks
    fees:
      - amount: 33700
        currency: "ZAR"
        payer: "SAHPRA"
        notes: "~$1,800 USD for clinical trial application"
    unique_features:
      - "Most mature African regulatory system"
      - "NHREC oversight with EC registration/accreditation"
      - "SANCTR registry for clinical trials"
      - "Reliance model for medicine registration"
      - "Capacity building requirements"
      - "Moderate fees (R33,700 ~$1,800)"
      - "Reciprocal recognition between registered ECs allowed"
      - "Joint reviews for multicenter trials"
      - "Rapid review for emergencies"
      - "G-EthicsHR-ZAF recommends sequential when EC lacks scientific capacity"
    references:
      - "https://www.sahpra.org.za/"

  # ===========================================================================
  # LEVEL 3 - CONCURRENT SUBMISSION, SEQUENTIAL APPROVAL (6 countries)
  # Submit to both, but regulatory waits for ethics approval
  # ===========================================================================

  - country_code: CD
    country_name: "Democratic Republic of the Congo"
    workflow_type: "concurrent_sequential"
    complexity_level: 3
    regulatory_authority:
      code: ACOREP
      name: "Autorité de Contrôle et de Régulation Pharmaceutique"
      review_days: 45  # After EC approval
      review_days_max: 60
      auto_approval: false
      emergency_review_days: 3  # 72 hours
    ethics_authority:
      code: EC
      name: "Ethics Committee"
      review_days: null  # Variable
      is_national: false
      meeting_frequency: "regular"
    workflow_steps:
      - step: 1
        name: "Concurrent Submission"
        description: "Submit to both EC and ACOREP simultaneously"
        authorities: ["EC", "ACOREP"]
        can_run_parallel: true
        gates: []
      - step: 2
        name: "EC Review"
        description: "EC reviews and approves"
        authorities: ["EC"]
        gates: []
      - step: 3
        name: "ACOREP Review After EC Approval"
        description: "ACOREP can only approve after EC approval received"
        authorities: ["ACOREP"]
        can_run_parallel: false
        gates: ["EC_approval"]
        estimated_days: 45
      - step: 4
        name: "Final Approval"
        description: "ACOREP approval completes process"
        gates: ["ACOREP_approval"]
    total_timeline_days: 45  # Plus EC time
    fees:
      - amount: 0
        currency: "CDF"
        payer: "local"
        notes: "Fees differentiate between local and non-resident sponsors"
    unique_features:
      - "Concurrent submission allowed"
      - "EC must approve before ACOREP can approve"
      - "4 national languages for informed consent forms"
      - "Nagoya Protocol compliance required"
      - "72-hour emergency review"
    references:
      - "http://www.rdc-sante.cd/"

  - country_code: CN
    country_name: "China"
    workflow_type: "dual_pathway"
