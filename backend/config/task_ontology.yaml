# Task Ontology v3.0 - Canonical Clinical Trial Tasks with International Regulatory Variations
# Defines standard tasks with typical durations, prerequisites, and country-specific regulatory variations
# Version 3.0 adds comprehensive international regulatory authority workflows for 22 countries

version: "3.0"
description: "Canonical task definitions for clinical trial timelines with international regulatory variations"

tasks:
  # ============================================================================
  # REGULATORY TASKS
  # ============================================================================

  - id: REG-001
    name: "IND/CTA Submission"
    category: Regulatory
    typical_duration_days: 60
    min_duration_days: 30
    max_duration_days: 90
    description: "Submit Investigational New Drug application (FDA) or Clinical Trial Application (EMA/MHRA)"
    is_mandatory: true
    gating_requirements:
      - "Protocol finalized and approved"
      - "Investigator's Brochure complete"
      - "CMC (Chemistry, Manufacturing, Controls) documentation ready"
      - "Preclinical safety data compiled"
    authority_specific:
      FDA:
        duration_days: 60
        notes: "30-day safety review hold period after submission"
        required_documents:
          - "FDA Form 1571"
          - "Protocol"
          - "Investigator's Brochure"
          - "CMC package"
      EMA:
        duration_days: 90
        notes: "60-day review period from validation"
        required_documents:
          - "EudraCT application"
          - "IMPD (Investigational Medicinal Product Dossier)"
      MHRA:
        duration_days: 60
        notes: "30-day review period from validation"
    country_variations:
      US:
        authority_code: FDA
        duration_days: 30
        workflow_type: "parallel"
        notes: "Can run parallel with IRB"
      AU:
        authority_code: TGA
        duration_days: 30
        workflow_type: "parallel"
        notes: "CTN (instant) or CTA (30-50 days)"
      CN:
        authority_code: NMPA
        duration_days: 60
        workflow_type: "parallel"
        auto_approval_days: 60
        notes: "Automatic approval if no response in 60 days"
      IN:
        authority_code: DCGI
        duration_days: 90
        workflow_type: "concurrent_sequential"
        auto_approval_days: 90
        notes: "Concurrent submission with EC, but must confirm EC approvals before final authorization"
      KE:
        authority_code: PPB
        duration_days: 30
        workflow_type: "three_layer_sequential"
        notes: "Second layer in EC → PPB → NACOSTI sequence"
      TZ:
        authority_code: TMDA
        duration_days: 60
        fast_track_days: 30
        fast_track_fee_multiplier: 2
        workflow_type: "multi_body"
        notes: "Three-body system: TMDA + NatHREC + COSTECH"
      VN:
        authority_code: MOH_ASTT
        duration_days: 25
        workflow_type: "four_layer_sequential"
        notes: "Part of 4-layer: CEBRGL → ASTT → NECBR → Minister (60+ days total)"
      ZW:
        authority_code: MCAZ
        duration_days: 60
        fast_track_days: 15
        workflow_type: "multi_body"
        notes: "Multi-body system: MCAZ + RCZ + NBA, parallel submissions encouraged"
      GB:
        authority_code: MHRA
        duration_days: 30
        notification_scheme_days: 14
        auto_approval_days: 30
        workflow_type: "parallel_integrated"
        notes: "IRAS combined review, automatic authorization if no response in 30 days"
      TH:
        authority_code: ThaiFDA
        duration_days: 60
        express_days: 10
        workflow_type: "concurrent_sequential"
        notes: "Concurrent with EC via Skynet E-Submission System"
      UG:
        authority_code: NDA
        duration_days: 60
        fast_track_days: 15
        workflow_type: "multi_body"
        notes: "Three-body oversight: NDA + UNCST + UNHRO"
      MX:
        authority_code: COFEPRIS
        duration_days: 30
        workflow_type: "sequential"
        notes: "REC approval required BEFORE COFEPRIS submission"
      PE:
        authority_code: INS
        duration_days: 30
        workflow_type: "sequential"
        notes: "EC approval required BEFORE INS submission (includes ANM binding opinion)"
      ZA:
        authority_code: SAHPRA
        duration_days: 91
        workflow_type: "flexible"
        notes: "Parallel allowed, but sequential recommended when EC lacks scientific review capacity"
      SL:
        authority_code: PBSL
        duration_days: 50
        expedited_days: 10
        workflow_type: "flexible"
        notes: "Sequential default, switches to parallel for emergencies (40-120 days by product type)"

  - id: REG-002
    name: "IRB/EC Approval"
    category: Regulatory
    typical_duration_days: 45
    min_duration_days: 21
    max_duration_days: 90
    description: "Obtain Institutional Review Board or Ethics Committee approval"
    is_mandatory: true
    prerequisites:
      - REG-001
    gating_requirements:
      - "Protocol finalized"
      - "Informed Consent Form drafted"
      - "Site regulatory documents prepared"
    checklist_id: STARTUP
    country_variations:
      US:
        authority_code: IRB
        duration_days: 30
        is_national: false
        workflow_type: "parallel"
        notes: "Institutional review, decentralized, runs parallel with FDA"
      BD:
        authority_code: NREC
        duration_days: null
        is_national: true
        workflow_type: "sequential"
        notes: "National committee, must approve BEFORE DGDA submission"
      KE:
        authority_code: EC
        duration_days: null
        is_national: false
        workflow_type: "three_layer_sequential"
        notes: "First step in 3-layer approval: EC → PPB → NACOSTI"
      TZ:
        authority_code: NatHREC
        duration_days: 30
        is_national: true
        workflow_type: "multi_body"
        notes: "National EC, runs parallel with TMDA (acknowledgement required), then COSTECH clearance"
      VN:
        authority_code: CEBRGL
        duration_days: 30
        is_national: false
        workflow_type: "four_layer_sequential"
        notes: "Institutional EC, first step in 4-layer sequential: CEBRGL → ASTT → NECBR → Minister"
      ZW:
        authority_code: MRCZ
        duration_days: 30
        is_national: true
        workflow_type: "multi_body"
        notes: "National EC (MRCZ), parallel with regulatory bodies (MCAZ + RCZ + NBA)"
      GB:
        authority_code: REC
        duration_days: 60
        is_national: true
        workflow_type: "parallel_integrated"
        notes: "Research Ethics Committee, integrated IRAS review with MHRA (single UK decision)"
      IN:
        authority_code: EC
        duration_days: null
        is_national: false
        workflow_type: "concurrent_sequential"
        notes: "Decentralized EC, concurrent submission with DCGI, but DCGI confirms EC approvals"
      CN:
        authority_code: EC
        duration_days: 30
        is_national: false
        workflow_type: "parallel"
        notes: "Runs parallel with NMPA (standard pathway); sequential for HGR pathway"
      AU:
        authority_code: HREC
        duration_days: 30
        is_national: false
        workflow_type: "parallel"
        notes: "Human Research Ethics Committee, runs parallel with TGA"
      CA:
        authority_code: REB
        duration_days: null
        is_national: false
        workflow_type: "parallel"
        notes: "Research Ethics Board, runs parallel with Health Canada"
      GN:
        authority_code: CNERS
        duration_days: 60
        is_national: true
        workflow_type: "sequential"
        notes: "National ethics committee, must approve BEFORE DNPM submission (48-hour emergency response)"
      MW:
        authority_code: NHSRC
        duration_days: null
        is_national: true
        workflow_type: "sequential"
        notes: "NCST-approved EC, must approve BEFORE PMRA submission"
      ML:
        authority_code: CIESS_USTTB
        duration_days: null
        is_national: true
        workflow_type: "sequential"
        notes: "Primary EC for clinical research, must approve BEFORE DPM submission"
      MX:
        authority_code: REC
        duration_days: 30
        is_national: false
        workflow_type: "sequential"
        notes: "Registered Ethics Committee, must approve BEFORE COFEPRIS submission"
      PE:
        authority_code: EC
        duration_days: null
        is_national: false
        workflow_type: "sequential"
        notes: "INS-accredited EC, must approve BEFORE INS submission"
      SL:
        authority_code: SLESRC
        duration_days: null
        is_national: true
        workflow_type: "flexible"
        notes: "Normally BEFORE PBSL, but can switch to parallel for emergencies"
      ZA:
        authority_code: EC
        duration_days: null
        is_national: false
        workflow_type: "flexible"
        notes: "NHREC-registered EC, parallel with SAHPRA allowed"
      TH:
        authority_code: ECMOPH
        duration_days: 75
        is_national: true
        workflow_type: "concurrent_sequential"
        notes: "Central EC (ECMOPH or CREC), concurrent with Thai FDA"
      UG:
        authority_code: EC
        duration_days: 60
        is_national: false
        workflow_type: "multi_body"
        notes: "UNCST-accredited EC, part of 3-body oversight with NDA + UNCST + UNHRO"

  - id: REG-003
    name: "Protocol Amendment Submission"
    category: Regulatory
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "Submit and obtain approval for protocol amendments"
    is_mandatory: false
    prerequisites:
      - REG-002

  - id: REG-004
    name: "Annual Safety Report"
    category: Regulatory
    typical_duration_days: 60
    min_duration_days: 30
    max_duration_days: 90
    description: "Prepare and submit annual safety report to regulatory authority"
    is_mandatory: true

  # ============================================================================
  # INTERNATIONAL REGULATORY TASKS
  # ============================================================================

  - id: REG-INT-001
    name: "Additional Regulatory Body Approval"
    aliases: ["NACOSTI Approval", "COSTECH Clearance", "UNCST Permit", "RCZ Approval", "NBA Approval"]
    category: Regulatory
    typical_duration_days: 30
    min_duration_days: 10
    max_duration_days: 60
    description: "Additional regulatory body approval required in multi-body systems"
    is_mandatory: true
    country_variations:
      KE:
        authority_code: NACOSTI
        duration_days: 30
        notes: "Third layer in EC → PPB → NACOSTI sequence, county-level notifications required"
      TZ:
        authority_code: COSTECH
        duration_days: null
        notes: "Third body after TMDA + NatHREC, reviews every 2 months, research clearance required"
      UG:
        authority_code: UNCST
        duration_days: 14
        notes: "Research permit required, part of 3-body oversight, includes security clearance from Office of President"
      ZW:
        authority_code: RCZ
        duration_days: 42
        notes: "Research Council of Zimbabwe, parallel with MCAZ, foreign researcher permits required"

  - id: REG-INT-002
    name: "National Ethics Committee Review"
    aliases: ["NECBR Review", "National EC Approval", "NREC Approval"]
    category: Regulatory
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "National-level ethics committee review (in addition to institutional EC)"
    is_mandatory: true
    country_variations:
      VN:
        authority_code: NECBR
        duration_days: 25
        notes: "Third layer in 4-layer sequential: CEBRGL → ASTT → NECBR → Minister"
      BD:
        authority_code: NREC
        duration_days: null
        notes: "National Research Ethics Committee, must approve BEFORE DGDA"
      TZ:
        authority_code: NatHREC
        duration_days: 30
        notes: "National HREC in addition to institutional EC, runs parallel with TMDA"

  - id: REG-INT-003
    name: "Ministerial/Final Approval"
    aliases: ["Minister of Health Approval", "Final Authorization"]
    category: Regulatory
    typical_duration_days: 5
    min_duration_days: 5
    max_duration_days: 14
    description: "Final ministerial or highest-level approval stage"
    is_mandatory: true
    country_variations:
      VN:
        authority_code: Minister
        duration_days: 5
        notes: "Final layer in 4-layer sequential: CEBRGL → ASTT → NECBR → Minister (5 days for final approval)"

  - id: REG-INT-004
    name: "Technical Review Authority Opinion"
    aliases: ["ANM Opinion", "Technical Assessment"]
    category: Regulatory
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 45
    description: "Additional technical review authority opinion required"
    is_mandatory: true
    country_variations:
      PE:
        authority_code: ANM
        duration_days: null
        notes: "ANM binding technical opinion on IP safety/quality (included in INS 30-day timeline)"

  - id: REG-INT-005
    name: "National Bioethics Authority Approval"
    aliases: ["NBA Approval", "Bioethics Review"]
    category: Regulatory
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "National bioethics authority approval (for genetic/bioethics oversight)"
    is_mandatory: false
    country_variations:
      ZW:
        authority_code: NBA
        duration_days: null
        notes: "National Bioethics Authority, part of multi-body system with MCAZ + RCZ"
      CN:
        authority_code: NHC
        duration_days: 30
        notes: "National Health Commission, required for HGR pathway (genetic resources trials)"

  - id: REG-INT-006
    name: "Clinical Trial Registration"
    aliases: ["CT Registration", "Trial Registry Submission"]
    category: Regulatory
    typical_duration_days: 7
    min_duration_days: 1
    max_duration_days: 14
    description: "Clinical trial registration in national or international registry"
    is_mandatory: true
    country_variations:
      KE:
        authority_code: PPB
        duration_days: 7
        notes: "Dual CT registration required: PPB + Pan African (PACTR)"
      SL:
        authority_code: PBSL
        duration_days: 7
        notes: "PACTR registration required"

  # ============================================================================
  # OPERATIONAL TASKS
  # ============================================================================

  - id: OPS-001
    name: "Site Identification & Feasibility"
    category: Operational
    typical_duration_days: 90
    min_duration_days: 60
    max_duration_days: 180
    description: "Identify potential sites and conduct feasibility assessments"
    is_mandatory: true
    checklist_id: STARTUP
    gating_requirements:
      - "Target enrollment numbers defined"
      - "Geographic distribution planned"
      - "Feasibility questionnaire prepared"

  - id: OPS-002
    name: "Site Contract Execution"
    category: Operational
    typical_duration_days: 60
    min_duration_days: 30
    max_duration_days: 120
    description: "Negotiate and execute site contracts and budgets"
    is_mandatory: true
    prerequisites:
      - OPS-001
    checklist_id: STARTUP

  - id: OPS-003
    name: "Study Drug Manufacturing & Release"
    category: Operational
    typical_duration_days: 120
    min_duration_days: 90
    max_duration_days: 180
    description: "Manufacture, test, and release study drug supplies"
    is_mandatory: true
    gating_requirements:
      - "Drug specifications finalized"
      - "Manufacturing plan approved"
      - "Quality control testing protocols ready"

  - id: OPS-004
    name: "Study Drug Distribution"
    category: Operational
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "Ship study drug to sites and ensure proper storage"
    is_mandatory: true
    prerequisites:
      - OPS-003
    checklist_id: SIV

  - id: OPS-005
    name: "eCRF System Build & Validation"
    category: Operational
    typical_duration_days: 90
    min_duration_days: 60
    max_duration_days: 120
    description: "Build and validate electronic Case Report Form system"
    is_mandatory: true
    checklist_id: STARTUP
    gating_requirements:
      - "eCRF specifications finalized"
      - "Edit checks defined"
      - "User acceptance testing completed"

  - id: OPS-006
    name: "Randomization System Setup"
    category: Operational
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "Set up and validate interactive randomization system (IWRS/IRT)"
    is_mandatory: true
    checklist_id: STARTUP

  # ============================================================================
  # SITE TASKS
  # ============================================================================

  - id: SITE-001
    name: "Site Initiation Visit (SIV)"
    category: Site
    typical_duration_days: 1
    min_duration_days: 1
    max_duration_days: 2
    description: "Conduct on-site training and study initiation"
    is_mandatory: true
    prerequisites:
      - REG-002
      - OPS-001
      - OPS-002
    checklist_id: SIV
    gating_requirements:
      - "Site regulatory approvals complete"
      - "Site contracts executed"
      - "Study materials delivered to site"

  - id: SITE-002
    name: "Site Activation"
    category: Site
    typical_duration_days: 7
    min_duration_days: 1
    max_duration_days: 14
    description: "Complete final readiness checks and activate site for enrollment"
    is_mandatory: true
    prerequisites:
      - SITE-001
    checklist_id: SAV

  - id: SITE-003
    name: "First Patient In (FPI)"
    category: Site
    typical_duration_days: 1
    min_duration_days: 1
    max_duration_days: 1
    description: "First patient enrolled and randomized"
    is_mandatory: true
    prerequisites:
      - SITE-002
    gating_requirements:
      - "All regulatory approvals in place"
      - "Site activated and ready"
      - "Study drug available at site"

  - id: SITE-004
    name: "Patient Enrollment Period"
    category: Site
    typical_duration_days: 365
    min_duration_days: 180
    max_duration_days: 730
    description: "Active enrollment period to reach target sample size"
    is_mandatory: true
    prerequisites:
      - SITE-003

  - id: SITE-005
    name: "Last Patient In (LPI)"
    category: Site
    typical_duration_days: 1
    min_duration_days: 1
    max_duration_days: 1
    description: "Last patient enrolled (enrollment complete)"
    is_mandatory: true
    prerequisites:
      - SITE-004

  - id: SITE-006
    name: "Patient Follow-up Period"
    category: Site
    typical_duration_days: 180
    min_duration_days: 90
    max_duration_days: 365
    description: "Follow-up period after last patient enrolled"
    is_mandatory: true
    prerequisites:
      - SITE-005

  - id: SITE-007
    name: "Last Patient Out (LPO)"
    category: Site
    typical_duration_days: 1
    min_duration_days: 1
    max_duration_days: 1
    description: "Last patient completes final study visit"
    is_mandatory: true
    prerequisites:
      - SITE-006

  - id: SITE-008
    name: "Site Monitoring Visits"
    category: Site
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "Regular monitoring visits to ensure compliance and data quality"
    is_mandatory: true
    prerequisites:
      - SITE-003

  # ============================================================================
  # DATA MANAGEMENT TASKS
  # ============================================================================

  - id: DATA-001
    name: "Data Cleaning & Query Resolution"
    category: Data
    typical_duration_days: 90
    min_duration_days: 60
    max_duration_days: 120
    description: "Clean data, resolve queries, and prepare for database lock"
    is_mandatory: true
    prerequisites:
      - SITE-007

  - id: DATA-002
    name: "Database Lock"
    category: Data
    typical_duration_days: 14
    min_duration_days: 7
    max_duration_days: 30
    description: "Freeze database after all data cleaned and queries resolved"
    is_mandatory: true
    prerequisites:
      - DATA-001
    gating_requirements:
      - "All CRFs completed"
      - "All queries resolved"
      - "All serious adverse events reported"

  - id: DATA-003
    name: "Statistical Analysis"
    category: Data
    typical_duration_days: 60
    min_duration_days: 30
    max_duration_days: 90
    description: "Conduct statistical analysis per Statistical Analysis Plan"
    is_mandatory: true
    prerequisites:
      - DATA-002

  - id: DATA-004
    name: "Clinical Study Report (CSR) Writing"
    category: Data
    typical_duration_days: 90
    min_duration_days: 60
    max_duration_days: 180
    description: "Prepare comprehensive Clinical Study Report"
    is_mandatory: true
    prerequisites:
      - DATA-003

  # ============================================================================
  # CLOSEOUT TASKS
  # ============================================================================

  - id: CLOSE-001
    name: "Site Closeout Visits"
    category: Closeout
    typical_duration_days: 90
    min_duration_days: 45
    max_duration_days: 180
    description: "Conduct site closeout visits and retrieve essential documents"
    is_mandatory: true
    prerequisites:
      - SITE-007
      - DATA-001
    checklist_id: CLOSEOUT
    gating_requirements:
      - "All patient follow-up complete"
      - "All data queries resolved"
      - "Drug accountability reconciled"

  - id: CLOSE-002
    name: "Study Archival"
    category: Closeout
    typical_duration_days: 60
    min_duration_days: 30
    max_duration_days: 90
    description: "Archive all essential study documents per regulatory requirements"
    is_mandatory: true
    prerequisites:
      - CLOSE-001
    checklist_id: CLOSEOUT

  - id: CLOSE-003
    name: "Final Regulatory Submissions"
    category: Closeout
    typical_duration_days: 30
    min_duration_days: 14
    max_duration_days: 60
    description: "Submit final study reports to regulatory authorities and IRBs"
    is_mandatory: true
    prerequisites:
      - DATA-004
    checklist_id: CLOSEOUT

# ============================================================================
# METADATA
# ============================================================================

categories:
  Regulatory:
    description: "Regulatory submissions and approvals"
    color: "#FF6B6B"
  Operational:
    description: "Operational setup and logistics"
    color: "#4ECDC4"
  Site:
    description: "Site-level activities"
    color: "#45B7D1"
  Data:
    description: "Data management and analysis"
    color: "#96CEB4"
  Closeout:
    description: "Study closeout activities"
    color: "#DDA15E"

phases:
  - "Phase I"
  - "Phase II"
  - "Phase III"
  - "Phase IV"
  - "Pilot"

# ============================================================================
# INTERNATIONAL REGULATORY AUTHORITIES (22 Countries, 57+ Authorities)
# ============================================================================

authorities:
  # North America
  - "FDA"  # United States
  - "IRB"  # United States - Institutional Review Board
  - "Health Canada"  # Canada
  - "REB"  # Canada - Research Ethics Board

  # Europe
  - "EMA"  # European Union
  - "MHRA"  # United Kingdom
  - "REC"  # United Kingdom - Research Ethics Committee
  - "UKECA"  # United Kingdom - UK Ethics Committee Authority

  # Asia-Pacific
  - "PMDA"  # Japan
  - "TGA"  # Australia
  - "HREC"  # Australia - Human Research Ethics Committee
  - "NMPA"  # China
  - "NHC"  # China - National Health Commission
  - "SEC"  # China - Scientific Ethics Committee
  - "DCGI"  # India
  - "ThaiFDA"  # Thailand
  - "ECMOPH"  # Thailand - Ethics Committee Ministry of Public Health
  - "CREC"  # Thailand - Central Research Ethics Committee
  - "MOH_ASTT"  # Vietnam - Ministry of Health Agency of Science Technology and Training
  - "NECBR"  # Vietnam - National Ethics Committee in Biomedical Research
  - "CEBRGL"  # Vietnam - Committee for Ethics in Biomedical Research at Grassroot Level

  # Latin America
  - "COFEPRIS"  # Mexico
  - "INS"  # Peru - Instituto Nacional de Salud
  - "ANM"  # Peru - Autoridad Nacional de Medicamentos

  # Africa
  - "DGDA"  # Bangladesh - Directorate General of Drug Administration
  - "NREC"  # Bangladesh - National Research Ethics Committee
  - "ACOREP"  # DRC - Agence Congolaise de Régulation Pharmaceutique
  - "DNPM"  # Guinea - Direction Nationale de la Pharmacie et du Médicament
  - "CNERS"  # Guinea - Comité National d'Éthique pour la Recherche en Santé
  - "PPB"  # Kenya - Pharmacy and Poisons Board
  - "NACOSTI"  # Kenya - National Commission for Science, Technology and Innovation
  - "LMHRA"  # Liberia - Liberia Medicines and Health Products Regulatory Authority
  - "NREB"  # Liberia - National Research Ethics Board
  - "PMRA"  # Malawi - Pharmacy, Medicines and Poisons Board Regulatory Authority
  - "NHSRC"  # Malawi - National Health Sciences Research Committee
  - "COMREC"  # Malawi - College of Medicine Research and Ethics Committee
  - "DPM"  # Mali - Direction de la Pharmacie et du Médicament
  - "CIESS_USTTB"  # Mali - CIESS/USTTB Ethics Committee
  - "PBSL"  # Sierra Leone - Pharmacy Board of Sierra Leone
  - "SLESRC"  # Sierra Leone - Sierra Leone Ethics and Scientific Review Committee
  - "TMDA"  # Tanzania - Tanzania Medicines and Medical Devices Authority
  - "NatHREC"  # Tanzania - National Health Research Ethics Committee
  - "COSTECH"  # Tanzania - Tanzania Commission for Science and Technology
  - "SAHPRA"  # South Africa - South African Health Products Regulatory Authority
  - "NHREC"  # South Africa - National Health Research Ethics Council
  - "NDA"  # Uganda - National Drug Authority
  - "UNCST"  # Uganda - Uganda National Council for Science and Technology
  - "UNHRO"  # Uganda - Uganda National Health Research Organization
  - "MCAZ"  # Zimbabwe - Medicines Control Authority of Zimbabwe
  - "RCZ"  # Zimbabwe - Research Council of Zimbabwe
  - "NBA"  # Zimbabwe - National Biotechnology Authority
  - "MRCZ"  # Zimbabwe - Medical Research Council of Zimbabwe

# ============================================================================
# WORKFLOW TYPES
# ============================================================================

workflow_types:
  parallel:
    description: "Regulatory and ethics submissions can run simultaneously"
    example: "US (FDA + IRB), Australia (TGA + HREC)"
    typical_complexity: 1

  sequential:
    description: "Ethics must approve BEFORE regulatory submission"
    example: "Bangladesh (NREC → DGDA), Guinea (CNERS → DNPM)"
    typical_complexity: 2

  flexible:
    description: "Normally sequential, can switch to parallel for emergencies"
    example: "Sierra Leone, South Africa"
    typical_complexity: 2.5

  concurrent_sequential:
    description: "Concurrent submission allowed, but regulatory waits for ethics approval"
    example: "India (DCGI + EC), Thailand (Thai FDA + EC)"
    typical_complexity: 3

  three_layer_sequential:
    description: "Three separate approval layers in sequence"
    example: "Kenya (EC → PPB → NACOSTI)"
    typical_complexity: 4

  four_layer_sequential:
    description: "Four separate approval stages in sequence"
    example: "Vietnam (CEBRGL → ASTT → NECBR → Minister)"
    typical_complexity: 4.5

  multi_body:
    description: "Multiple regulatory bodies with hybrid workflows"
    example: "Tanzania (TMDA + NatHREC + COSTECH), Zimbabwe (MCAZ + RCZ + NBA + MRCZ)"
    typical_complexity: 5

  parallel_integrated:
    description: "Parallel with coordinated/integrated review process"
    example: "UK (MHRA + REC via IRAS combined review)"
    typical_complexity: 1

