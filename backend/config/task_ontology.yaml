# ============================================================================
# WORKFLOW TYPES (8 Complexity Levels)
# ============================================================================

workflow_types:
  parallel:
    description: "Regulatory and ethics submissions run simultaneously"
    complexity: 1
    examples: ["US (FDA + IRB)", "Australia (TGA + HREC)", "Canada (HC + REB)"]
    typical_timeline_days: 30

  parallel_integrated:
    description: "Parallel with coordinated/integrated review process"
    complexity: 1
    examples: ["UK (MHRA + REC via IRAS combined review)"]
    typical_timeline_days: 30
    unique_features: ["Single application", "Coordinated review", "Joint RFIs"]

  sequential:
    description: "Ethics must approve BEFORE regulatory submission"
    complexity: 2
    examples: ["Bangladesh (NREC → DGDA)", "Guinea (CNERS → DNPM)", "Mali", "Mexico", "Peru"]
    typical_timeline_days: 60

  flexible:
    description: "Normally sequential, can switch to parallel for emergencies"
    complexity: 2.5
    examples: ["Sierra Leone", "South Africa"]
    typical_timeline_days: "10-120"

  concurrent_sequential:
    description: "Concurrent submission, but regulatory waits for ethics approval"
    complexity: 3
    examples: ["India (DCGI + EC)", "Thailand (Thai FDA + EC)", "DRC", "Liberia"]
    typical_timeline_days: 45

  concurrent_sequential_multibody:
    description: "Concurrent with multi-body oversight coordination"
    complexity: 3
    examples: ["Uganda (NDA + UNCST + UNHRO)"]
    typical_timeline_days: 60

  three_layer_sequential:
    description: "Three separate approval layers in sequence"
    complexity: 4
    examples: ["Kenya (EC → PPB → NACOSTI)"]
    typical_timeline_days: 60

  four_layer_sequential:
    description: "Four separate approval stages in sequence (most complex sequential)"
    complexity: 4.5
    examples: ["Vietnam (CEBRGL → ASTT → NECBR → Minister)"]
    typical_timeline_days: 60

  three_body_hybrid:
    description: "Three-body system with hybrid concurrent/sequential workflow"
    complexity: 5
    examples: ["Tanzania (TMDA || NatHREC → COSTECH)"]
    typical_timeline_days: 90

  four_body_parallel:
    description: "Four regulatory bodies with encouraged parallel submissions"
    complexity: 5
    examples: ["Zimbabwe (MCAZ + RCZ + NBA + MRCZ)"]
    typical_timeline_days: 60
