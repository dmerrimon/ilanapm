    name: "Therapeutic Goods Administration"
    country: AU
    country_name: "Australia"
    authority_type: "regulatory"
    review_time_multiplier: 0.95
    typical_review_days: 30
    ctn_days: 0  # Clinical Trial Notification - instant
    cta_days: 30  # Clinical Trial Approval
    cta_days_max: 50
    emergency_review_days: null
    auto_approval_days: null
    notes: "Two pathways: CTN (instant acknowledgement) or CTA (30-50 days)"

  - code: HREC
    name: "Human Research Ethics Committee"
    country: AU
    country_name: "Australia"
    authority_type: "ethics"
    is_national: false
    typical_review_days: 30
