# Authorities Configuration for Clinical Trial Ontology v3.0
# Central registry of regulatory authorities and ethics committees
# Version: 3.0
# Last Updated: 2026-01-16

authorities:
  # ===========================================================================
  # UNITED STATES
  # ===========================================================================
  - code: FDA
    name: "U.S. Food and Drug Administration"
    country: US
    country_name: "United States"
    authority_type: "regulatory"
    review_time_multiplier: 1.2
    typical_review_days: 30
    emergency_review_days: null
    auto_approval_days: null
    notes: "FDA tends to have longer review times, especially for novel therapies; 30-day safety review hold period after IND submission"

  - code: IRB
    name: "Institutional Review Board"
    country: US
    country_name: "United States"
    authority_type: "ethics"
    is_national: false
    typical_review_days: 30
    review_time_multiplier: 1.0
    notes: "Decentralized ethics review, site-specific; varies by institution"

  # ===========================================================================
  # AUSTRALIA
  # ===========================================================================
